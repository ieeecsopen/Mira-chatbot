name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for unused dependencies
        run: npx depcheck --ignores="@types/*,tailwindcss,@tailwindcss/*,vite-plugin-pwa" || true

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: Check bundle size
        run: |
          npm run build
          echo "📦 Bundle Size Analysis:"
          du -sh dist/
          echo ""
          echo "Top 10 largest files:"
          find dist -type f -exec du -h {} + | sort -rh | head -10

      - name: Check for console.log statements
        run: |
          echo "🔍 Checking for console.log statements in src..."
          if grep -r "console\.log" --include="*.ts" --include="*.tsx" src/ | grep -v "\.test\." | grep -v "// debug"; then
            echo "⚠️ Found console.log statements (consider removing for production)"
          else
            echo "✅ No console.log statements found"
          fi
