name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on files changed
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label PR by size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: 10
          s_label: 'size/S'
          s_max_size: 50
          m_label: 'size/M'
          m_max_size: 200
          l_label: 'size/L'
          l_max_size: 500
          xl_label: 'size/XL'
          fail_if_xl: false

  pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Comment build status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Get dist folder size
            let totalSize = 0;
            const distPath = './dist';
            if (fs.existsSync(distPath)) {
              const files = fs.readdirSync(distPath, { recursive: true, withFileTypes: true });
              for (const file of files) {
                if (file.isFile()) {
                  const path = `${file.path}/${file.name}`;
                  totalSize += fs.statSync(path).size;
                }
              }
            }
            
            const sizeKB = (totalSize / 1024).toFixed(2);
            const sizeMB = (totalSize / (1024 * 1024)).toFixed(2);
            
            const body = `## 🏗️ Build Report
            
            | Metric | Value |
            |--------|-------|
            | Build Status | ✅ Success |
            | Bundle Size | ${sizeMB} MB (${sizeKB} KB) |
            | Node Version | 20.x |
            
            > This comment is automatically generated for each PR.`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🏗️ Build Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
