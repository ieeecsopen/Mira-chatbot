name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run security scan daily at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=moderate || true

      - name: Check for known vulnerabilities
        run: |
          echo "🛡️ Checking for vulnerabilities in dependencies..."
          npx audit-ci --moderate || true

      - name: Check for secrets in code
        run: |
          echo "🔑 Scanning for potential secrets..."
          # Simple check for common secret patterns
          if grep -rE "(api_key|apikey|secret|password|token)(\s*=\s*['\"][^'\"]+['\"])" --include="*.ts" --include="*.tsx" --include="*.js" src/ 2>/dev/null; then
            echo "⚠️ Potential secrets found in code - please review"
          else
            echo "✅ No obvious secrets found"
          fi
